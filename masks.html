<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MASKS · Klone</title>
<link rel="icon" href="favicon.png">
<link rel="stylesheet" href="klone.css">
<style>
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vmin}
#p{position:relative}
#p.ouvre{animation:ouvre .7s steps(7) both}
@keyframes ouvre{0%{clip-path:inset(0 0 100% 0)}100%{clip-path:inset(0 0 0 0)}}
.plaque{display:flex;align-items:center;gap:1vmin;font:clamp(10px,2.2vmin,16px)/1 "PS",monospace;color:var(--phos);letter-spacing:.08em}
.plaque b{font-weight:normal;min-width:16ch;text-align:center;text-shadow:0 0 .6em rgba(255,167,38,.45)}
.encres{position:fixed;right:max(6px,env(safe-area-inset-right));bottom:max(6px,env(safe-area-inset-bottom));display:flex;z-index:10}
.encres button{font:14px/1 "UN",monospace;letter-spacing:0}
.num{display:flex;gap:8px;justify-content:center}.pt{display:block;width:6px;height:6px;background:#3a2410}.pt.on{background:var(--ambre)}
.plaque .picto{font-size:clamp(14px,3vmin,22px)}
.boom{font-size:20px}
@media (prefers-reduced-motion:reduce){#p.ouvre{animation:none}}
</style>
</head>
<body>
<div id="p" class="ansi" role="img" aria-describedby="nom"></div>
<div class="plaque-bloc"><div class="plaque"><button class="picto" id="prec" aria-label="Mask précédent">«</button><b id="nom"></b><button class="picto" id="suiv" aria-label="Mask suivant">»</button></div><div class="num" id="num"></div></div>
<div class="encres"><button class="picto" id="m0" aria-label="Encres du Mask"></button><button class="picto" id="m1" aria-label="Phosphore"></button></div>
<a class="boom" href="./" aria-label="Baku Boom">&lt;&lt;</a>
<div class="balayage"></div>
<script src="masks.js"></script>
<script src="haoma.js"></script>
<script>
(function(){
'use strict';
var ORDRE=Object.keys(MASKS),n=0,mode=0,pre=document.getElementById('p');
try{n=+(sessionStorage.getItem('klone:mask')||0)%ORDRE.length;mode=+(localStorage.getItem('klone:maskmode')||0);}catch(e){}
var hh=location.hash.slice(1).split(',');if(ORDRE.indexOf(hh[0])>=0)n=ORDRE.indexOf(hh[0]);if(hh[1]==='phosphore')mode=1;
function rgb(h){return [parseInt(h.substr(1,2),16),parseInt(h.substr(3,2),16),parseInt(h.substr(5,2),16)];}
/* Phosphore : six intensités d'ambre, la palette fermée de la borne */
var AMB=['#0b0908','#3a2208','#6e4210','#b06a18','#ffa726','#ffe3a0'];
function phos(h){var c=rgb(h),v=(c[0]*.3+c[1]*.59+c[2]*.11)/255;if(h==='#0b0908')return AMB[0];return AMB[Math.min(5,1+Math.floor(Math.pow(v,.8)*5))];}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function rendre(){
  var m=MASKS[ORDRE[n]],P=m.pal,o='';
  function c(k){var h=P[k]||'#0b0908';return mode?phos(h):h;}
  for(var y=0;y<m.g.length;y++){var G=m.g[y],F=m.f[y],B=m.b[y],run='',cf=null,cb=null;o+='<div>';
    var th=performance.now(),hh2=window.HAOMA&&HAOMA.intensite();for(var x=0;x<G.length;x++){var f=c(F[x]),b=c(B[x]);if(hh2){f=HAOMA.ink(f,x,y,th);b=HAOMA.ink(b,x+1,y,th);}
      if(f!==cf||b!==cb){if(run)o+='<span style="color:'+cf+';background:'+cb+'">'+esc(run)+'</span>';run='';cf=f;cb=b;}run+=G[x];}
    o+='<span style="color:'+cf+';background:'+cb+'">'+esc(run)+'</span></div>';}
  pre.innerHTML=o;
  document.getElementById('nom').textContent=m.nom;
  document.getElementById('num').innerHTML=ORDRE.map(function(k,i){return '<i class="pt'+(i===n?' on':'')+'"></i>';}).join('');
  function lu(h){var c=rgb(h);return c[0]*.3+c[1]*.59+c[2]*.11;}
  var pk=Object.keys(P).filter(function(k){return k!=='.'&&k!=='0'&&/[a-z]/.test(k);}).sort(function(a,b){return lu(P[b])-lu(P[a]);}).slice(0,4);
  var b0=document.getElementById('m0'),b1=document.getElementById('m1');
  b0.innerHTML=pk.map(function(k){return '<span style="color:'+P[k]+'">█</span>';}).join('');
  b1.innerHTML='<span style="color:#6e4210">█</span><span style="color:#b06a18">█</span><span style="color:#ffa726">█</span><span style="color:#ffe3a0">█</span>';
  b0.setAttribute('aria-pressed',mode===0);b1.setAttribute('aria-pressed',mode===1);
  b0.style.opacity=mode===0?1:.4;b1.style.opacity=mode===1?1:.4;b0.style.outline=mode===0?'1px solid #ffe3a0':'none';b1.style.outline=mode===1?'1px solid #ffe3a0':'none';
  fit();
}
/* Taille : un nombre entier de pixels physiques par case, la figure entière à l'écran */
function fit(){var m=MASKS[ORDRE[n]],W=m.g[0].length,H=m.g.length,d=devicePixelRatio||1;
  var bw=innerWidth*0.94,bh=innerHeight-Math.max(90,innerHeight*0.16);
  var px=Math.max(4,Math.floor(Math.min(bw/W,bh/H)*d));pre.style.setProperty('--c',(px/d)+'px');}
function va(k){n=(n+k+ORDRE.length)%ORDRE.length;try{sessionStorage.setItem('klone:mask',n);}catch(e){}
  pre.classList.remove('ouvre');void pre.offsetWidth;pre.classList.add('ouvre');rendre();}
function encre(k){mode=k;try{localStorage.setItem('klone:maskmode',k);}catch(e){}rendre();}
document.getElementById('prec').onclick=function(){va(-1);};
document.getElementById('suiv').onclick=function(){va(1);};
document.getElementById('m0').onclick=function(){encre(0);};
document.getElementById('m1').onclick=function(){encre(1);};
var sx=null;addEventListener('touchstart',function(e){sx=e.touches[0].clientX;},{passive:true});
addEventListener('touchend',function(e){if(sx===null)return;var d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>40)va(d<0?1:-1);sx=null;});
addEventListener('keydown',function(e){if(e.key==='ArrowLeft')va(-1);if(e.key==='ArrowRight')va(1);if(e.key==='Escape')location.href='./';});
addEventListener('resize',fit);
document.fonts.load('8px UN').then(function(){pre.classList.add('ouvre');rendre();});
setInterval(function(){if(window.HAOMA&&HAOMA.intensite()){rendre();HAOMA.respire(pre,performance.now());}},150);
})();
</script>
</body>
</html>
